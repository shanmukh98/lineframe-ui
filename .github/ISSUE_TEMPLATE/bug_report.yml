name: Bug report
description: Report a reproducible library, documentation, or tooling problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Lineframe. Check existing issues first, then reduce the
        problem to the smallest example you can share. Remove credentials and private data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the pinned CDN tag, release tarball version, or source commit.
      placeholder: v0.7.0, or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: usage
    attributes:
      label: Where does the problem occur?
      multiple: true
      options:
        - CDN files
        - GitHub Release tarball / bundled consumer
        - Source checkout / build tooling
        - Documentation website
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide numbered steps and minimal HTML/CSS/JS, or a public reproduction link.
      placeholder: |
        1. Load these entrypoints...
        2. Use this markup and these settings...
        3. Focus, click, resize, or scroll...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead? Include relevant errors without secrets.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Include browser/version, operating system, viewport, zoom, theme, and accent.
        For tooling problems, include Node/npm versions and the command that failed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Visual or accessibility evidence
      description: |
        If relevant, attach desktop/mobile and light/dark screenshots, keyboard steps,
        assistive-technology details, reduced-motion settings, or measured contrast.
        Describe the issue in text as well; screenshots alone may miss the interaction.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and private information from this report.
          required: true
