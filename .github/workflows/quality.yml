name: Quality and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting, types, and documentation
        run: npm run check

      - name: Build the library and website
        run: npm run build:site

      - name: Check generated CDN assets
        run: |
          status="$(git status --porcelain --untracked-files=normal -- \
            lineframe.css lineframe-accents.css \
            lineframe.js lineframe.js.map \
            lineframe-theme.js lineframe-theme.js.map \
            lineframe-toc.js lineframe-toc.js.map lineframe-icons.svg)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "::error::Run npm run build and commit the generated root assets."
            exit 1
          fi

      - name: Run unit regressions
        run: npm run test:unit

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser regressions
        run: npm run test:browser

      - name: Smoke-test the package
        run: npm run check:package

      - name: Upload the Pages artifact
        if: >-
          github.repository == 'shanmukh98/lineframe-ui' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy Pages
    needs: quality
    if: >-
      github.repository == 'shanmukh98/lineframe-ui' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
