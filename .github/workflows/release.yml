name: Release tarball

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Verify and pack
    if: github.repository == 'shanmukh98/lineframe-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Match the tag to the package version
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(name, "@shanmukh98/lineframe-ui", "Release filename depends on the package name.");
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, "Tag must match package.json version.");
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Build the library
        run: npm run build

      - name: Run unit regressions
        run: npm run test:unit

      - name: Smoke-test the package
        run: npm run check:package

      - name: Create the versioned tarball
        run: |
          mkdir release
          npm pack --quiet --ignore-scripts --pack-destination release
          test -f "release/shanmukh98-lineframe-ui-${GITHUB_REF_NAME#v}.tgz"

      - name: Transfer the verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Publish the tarball without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="release/shanmukh98-lineframe-ui-${GITHUB_REF_NAME#v}.tgz"
          test -f "$archive"
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"
